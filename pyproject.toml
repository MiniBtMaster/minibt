[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylightcharts"
version = "0.1.6"
description = "TradingView Lightweight Charts for Python (bridged, near-full API coverage)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "owen", email = "407841129@qq.com" }]
keywords = ["financial-charting", "charting", "candlestick", "tradingview", "lightweight-charts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "pywebview>=5.0.5",
]

[project.optional-dependencies]
qt = ["PySide6"]
jupyter = ["ipython"]
test = ["pytest", "pillow"]
e2e = ["playwright", "pillow"]
docs = ["mkdocs-material"]
dev = ["pytest", "build", "twine", "ruff", "pillow", "playwright", "mkdocs-material"]

[project.urls]
Homepage = "https://github.com/MiniBtMaster/pylightcharts"
Repository = "https://github.com/MiniBtMaster/pylightcharts"
Issues = "https://github.com/MiniBtMaster/pylightcharts/issues"
Documentation = "https://github.com/MiniBtMaster/pylightcharts/tree/main/docs"
Changelog = "https://github.com/MiniBtMaster/pylightcharts/blob/main/docs/changelog.md"
PyPI = "https://pypi.org/project/pylightcharts/"

[tool.setuptools]
include-package-data = true

# Discover `pylightcharts` **and** its subpackages (`pylightcharts.panels`).
# A bare `packages = ["pylightcharts"]` silently drops the subpackage from
# both the wheel and the sdist.
[tool.setuptools.packages.find]
include = ["pylightcharts*"]

[tool.setuptools.package-data]
pylightcharts = ["js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/legacy", "tests/e2e", "reference", "jslib", "examples", ".*"]
markers = ["slow: long-running tests (wheel build)"]
